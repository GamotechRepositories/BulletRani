server.port=5000
spring.application.name=RikshawXBackend

rikshawx.jwt-secret=aviator_super_secret_jwt_key_2026
rikshawx.jwt-days=7
# Reuse existing Node store so accounts/history carry over
rikshawx.store-path=../backend/data/store.json
# Socket.IO (netty) — frontend SOCKET_URL should point here
rikshawx.socket-host=0.0.0.0
rikshawx.socket-port=5001

# Provider Game SDK (in.oreng:game-sdk) — also editable live from Admin → Provider Integration
rikshawx.provider.enabled=${PROVIDER_ENABLED:false}
rikshawx.provider.api-url=${PROVIDER_API_URL:https://api.dpbossking.com/api/v1}
rikshawx.provider.api-key=${GAME_SERVER_API_KEY:}
rikshawx.provider.table-id=${PROVIDER_TABLE_ID:rikshawx_main}
rikshawx.provider.game-code=${PROVIDER_GAME_CODE:RIKSHAWX}
